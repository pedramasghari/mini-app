services:
  postgres:
    image: postgres:17-alpine
    container_name: mini-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miniapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miniapp_password}
      POSTGRES_DB: ${POSTGRES_DB:-miniapp}
    volumes:
      - mini_app_postgres:/var/lib/postgresql/data
    networks:
      - mini_app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-miniapp} -d $${POSTGRES_DB:-miniapp}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: mini-app-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: miniapp

      TELEGRAM_BOT_TOKEN: "8997481007:AAG1QZaafYi3e7RpYU2TuEFlhZgz8-xlQvo"

      FRONTEND_URL: "http://localhost"

      ADMIN_BOT_TOKEN: "8997481007:AAG1QZaafYi3e7RpYU2TuEFlhZgz8-xlQvo"
      ADMIN_TELEGRAM_IDS: "1194031410"

      MINI_APP_URL: "t.me/diceGameGamble_bot/IDto"

      SMSCODE_API_VERSION: "v2"
      SMSCODE_API_TOKEN: "c3c0f40974a4b4f1f908a48e155c091d3190dba0877ce5ee086a6caeab514f3a"
      SMSCODE_APPLE_CATALOG_PRODUCT_ID: "0"
      SMSCODE_APPLE_MAX_PRICE_USD: "0.03"

      SMSCODE_WEBHOOK_URL: "https://version-athletic-administrator-eleven.trycloudflare.com/webhooks/smscode"

      ZIBAL_ENABLED: "true"
      ZIBAL_MERCHANT: "zibal"
      ZIBAL_CALLBACK_URL: "https://t.me/diceGameGamble_bot/IDto"

      ZIBAL_MIN_DEPOSIT_IRT: "1000"
      ZIBAL_MAX_DEPOSIT_IRT: "50000000"

      ZIBAL_TIMEOUT_MS: "15000"

    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    expose:
      - "4000"
    networks:
      - mini_app

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:4000}
    container_name: mini-app-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: ${BACKEND_URL:-http://backend:4000}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    expose:
      - "3000"
    networks:
      - mini_app

  nginx:
    image: nginx:1.27-alpine
    container_name: mini-app-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/var/www/uploads:ro
    networks:
      - mini_app

volumes:
  mini_app_postgres:

networks:
  mini_app:
    driver: bridge
