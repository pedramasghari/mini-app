services:
  postgres:
    image: postgres:17-alpine
    container_name: mini-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniapp
      POSTGRES_PASSWORD: miniapp_password
      POSTGRES_DB: miniapp
    ports:
      - "5432:5432"
    volumes:
      - mini_app_postgres:/var/lib/postgresql/data

volumes:
  mini_app_postgres:
